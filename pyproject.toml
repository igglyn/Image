[project]
name = "image-blend-studio"
version = "0.1.0"
description = "Qt + Python image blending app with extensible Vulkan shader-based filter pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
]

[project.scripts]
image-blend-studio = "image_blend_app.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
